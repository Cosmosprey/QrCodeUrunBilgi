# Keeps the versions of the GitHub Actions used in .github/workflows up to date (one pull request a month at most).
# All Actions updates arrive together in one pull request, so one CI run tests them as they will be used.
# The npm packages are updated by hand: the Firebase SDK version in the pages must match the package.json one.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
