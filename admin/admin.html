<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://www.gstatic.com; object-src 'none'; base-uri 'none'">
    <title>Admin Paneli | QR Kodlu Ürün Bilgi Sistemi</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-theme">

    <!-- GİRİŞ EKRANI (yönetici girişi yapılana kadar tek görünen bölüm) -->
    <div id="login-view" class="login-wrapper d-none">
        <div class="admin-card login-card">
            <h2 class="fw-bold mb-4"><i class="bi bi-qr-code-scan text-primary me-2"></i>QR Panel</h2>
            <h5 class="mb-3 fw-bold">Yönetici Girişi</h5>
            <form id="login-form" novalidate>
                <div class="mb-3">
                    <input type="text" id="login-username" class="form-control" placeholder="Kullanıcı adı"
                        autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="login-password" class="form-control" placeholder="Parola"
                        autocomplete="current-password" required>
                </div>
                <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>
                <button type="submit" id="login-btn" class="btn btn-primary w-100 py-3 fw-bold">GİRİŞ YAP</button>
            </form>
        </div>
    </div>

    <div id="app-view" class="container-fluid d-none">
        <div class="row">
            <!-- SOL FORM -->
            <div class="col-lg-5 col-xl-4 form-sidebar">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0"><i class="bi bi-qr-code-scan text-primary me-2"></i>QR Panel</h2>
                    <button type="button" id="logout-btn" class="btn btn-sm btn-outline-light" title="Çıkış yap">
                        <i class="bi bi-box-arrow-right me-1"></i>Çıkış
                    </button>
                </div>
                <div class="admin-card">
                    <h4 id="form-title" class="mb-4 fw-bold">Ürün Ekle</h4>
                    <form id="product-form">
                        <div class="mb-3">
                            <!-- İsim Alanı -->
                            <input type="text" id="name" class="form-control" placeholder="Ürün Adı" required
                                minlength="2" maxlength="70">
                        </div>
                        <div class="row mb-3">
                            <!-- Fiyat Alanı -->
                            <div class="col-7"><input type="number" id="price" class="form-control" min="0.01"
                                    step="0.01" placeholder="Fiyat (₺)" required></div>
                            <div class="col-5">
                                <!-- Kategori Alanı -->
                                <select id="category" class="form-select">
                                    <option value="Yiyecek">Yiyecek</option>
                                    <option value="İçecek">İçecek</option>
                                    <option value="Temizlik Malzemeleri">Temizlik Malzemeleri</option>
                                </select>
                            </div>
                        </div>
                        <!-- Tarih Türü Seçimi -->
                        <div class="mb-3">
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="dateType" id="typeSKT"
                                        value="SKT" checked>
                                    <label class="form-check-label text-white" for="typeSKT">SKT</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="dateType" id="typeTETT"
                                        value="TETT">
                                    <label class="form-check-label text-white" for="typeTETT">TETT</label>
                                </div>
                            </div>
                        </div>
                        <!-- Son Kullanma Tarihi Alan -->
                        <div class="mb-3">
                            <label for="lastUseDate" class="form-label small text-white-50 mb-1">SKT / TETT tarihi</label>
                            <input type="date" id="lastUseDate" class="form-control">
                        </div>
                        <!-- Stok Adedi Alanı -->
                        <div class="mb-3">
                            <div class="input-group">
                                <input type="number" id="stockCount" class="form-control" placeholder="Stok Adedi"
                                    min="0" step="1" required>
                            </div>
                        </div>
                        <!-- Açıklama Alanı -->
                        <div class="mb-3"><textarea id="description" class="form-control" rows="2" maxlength="1000"
                                placeholder="Ürün açıklaması..."></textarea></div>
                        <!-- Görsel URL Alanı -->
                        <div class="mb-4 d-flex align-items-center gap-2">
                            <input type="file" id="imageFile" class="form-control" accept="image/jpeg,image/png,image/webp,image/gif">
                        </div>
                        <div id="form-error" class="alert alert-danger py-2 d-none" role="alert"></div>
                        <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-3 fw-bold">KAYDET</button>
                    </form>
                </div>
            </div>

            <!-- SAĞ LİSTE -->
            <div class="col-lg-7 col-xl-8 content-area">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <input type="text" id="search-input" class="form-control w-50 rounded-pill ps-4"
                        placeholder="Ürün ara...">
                </div>
                <div id="list-error" class="alert alert-danger py-2 d-none" role="alert"></div>
                <div class="d-flex align-items-center gap-4 flex-grow-1">
                    <button class="nav-btn" id="prevBtn"><i
                            class="bi bi-chevron-left"></i></button>
                    <div id="product-grid" class="product-grid-container"></div>
                    <button class="nav-btn" id="nextBtn"><i
                            class="bi bi-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../admin/admin_script.js"></script>

    <div id="qrModal" class="qr-modal d-none">

        <div class="qr-modal-box">
            <h5>QR Kod</h5>

            <div id="qrContainer"></div>

            <p id="qrLink" class="qr-link"></p>

            <button id="qrCloseBtn" type="button" class="btn btn-secondary mt-2">Kapat</button>
        </div>

    </div>
</body>

</html>
