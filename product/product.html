<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="product-theme">

    <!-- Yükleniyor Ekranı -->
    <div id="loading" class="text-center" style="margin-top: 100px;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-dark">Ürün bilgileri getiriliyor...</p>
    </div>

    <!-- Hata Mesajı -->
    <div id="error" class="container text-center d-none" style="margin-top: 100px;">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
        <h3 class="mt-3 text-dark">Ürün Bulunamadı</h3>
        <p class="text-dark">Lütfen QR kodu tekrar okutun veya yöneticiyle iletişime geçin.</p>
    </div>

    <!-- Bağlantı Sorunu (ürün var olabilir ama bilgiler alınamadı) -->
    <div id="load-error" class="container text-center d-none" style="margin-top: 100px;">
        <i class="bi bi-wifi-off text-warning" style="font-size: 3rem;"></i>
        <h3 class="mt-3 text-dark">Bağlantı Sorunu</h3>
        <p class="text-dark">Ürün bilgileri alınamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.</p>
        <button id="retry-btn" type="button" class="btn btn-primary">Tekrar Dene</button>
    </div>

    <!-- Ürün İçeriği (Başlangıçta Gizli) -->
    <div id="product-card" class="d-none">
        <div class="hero-section">
            <img id="image" src="" class="hero-img" alt="Ürün">
        </div>

        <div class="product-content">
            <!-- 1. GRUP: BAŞLIK VE STOK -->
            <div class="content-segment header-segment mb-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span id="category" class="text-uppercase fw-bold text-dark small">Kategori</span>
                    <span id="stock" class="badge rounded-pill">Stok Durumu</span>
                </div>
                <h1 id="name" class="fw-bold text-dark m-0">Ürün Adı</h1>
            </div>

            <!-- 2. GRUP: FİYAT VE İNDİRİM -->
            <div class="content-segment price-segment">
                <label class="segment-label text-dark" style="font-size: 0.9rem;">Satış Fiyatı</label>
                <div id="price" class="price-tag text-dark fw-bold" style="font-size: 2.3rem">0₺</div>
            </div>

            <!-- 3. GRUP: AÇIKLAMA -->
            <div class="content-segment mb-4">
                <label class="segment-label text-dark">Ürün Açıklaması</label>
                <p id="description" class="product-description text-dark mb-0">Açıklama yükleniyor...</p>
            </div>

            <!-- 4. GRUP: BİLGİ KUTUSU (SKT) -->
            <div class="info-box d-flex align-items-center gap-3 p-3 mt-auto">
                <i class="bi bi-shield-check text-primary fs-3"></i>
                <div id="lastUseDate" class="text-dark w-100">--</div>
            </div>
        </div>

    </div>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../product/product_script.js"></script>
</body>

</html>
